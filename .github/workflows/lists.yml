# Recompiles the filter lists every day and publishes them to the `lists`
# branch. The Android and iOS apps download from there, verifying every file
# against the SHA-256 in report.json before installing it.
name: Update lists

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tools
        run: |
          pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Compile
        working-directory: compiler
        run: python -m nullroute_compiler --out ../dist --validate-selectors on
      - name: Test compiled output (canaries, budgets, hashes)
        working-directory: compiler
        run: python -m pytest -v
      - name: Publish to the lists branch
        run: |
          cd dist
          git init -q -b lists
          git config user.name "nullroute-bot"
          git config user.email "nullroute-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Lists $(jq -r .generatedAt report.json)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lists
