# Tag a version (git tag v1.0.0 && git push --tags) to publish the Chrome
# extension zip and a signed Android APK as a GitHub release.
#
# Android signing secrets (optional; without them the APK is debug-signed):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile lists
        run: |
          pip install playwright && python -m playwright install --with-deps chromium
          cd compiler && python -m nullroute_compiler --out ../dist --validate-selectors on
      - name: Chrome extension
        run: |
          node extension/scripts/build.mjs
          cd extension && zip -r ../nullroute-chrome-${GITHUB_REF_NAME}.zip manifest.json src rulesets icons
      - name: Android APK
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > release.keystore
            cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
            ./gradlew :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../nullroute-android-${GITHUB_REF_NAME}.apk
          else
            ./gradlew :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../nullroute-android-${GITHUB_REF_NAME}-debug.apk
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nullroute-chrome-*.zip
            nullroute-android-*.apk
          generate_release_notes: true
