[project]
name = "nullroute-compiler"
version = "1.0.0"
description = "Compiles EasyList/EasyPrivacy/hosts lists into Chrome DNR, Safari content-blocker and DNS sinkhole rules"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
validate = ["playwright>=1.40"]
test = ["pytest>=8"]

[project.scripts]
nullroute-compile = "nullroute_compiler.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
